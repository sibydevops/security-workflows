name: Reusable DAST Scan

on:
  workflow_call:
    inputs:
      target-url:
        description: 'Target URL for DAST scanning'
        required: true
        type: string
      zap-rules-file:
        description: 'Path to ZAP rules file'
        required: false
        default: '.zap/rules.tsv'
        type: string
      scan-type:
        description: 'Scan type: baseline or full'
        required: false
        default: 'baseline'
        type: string
      fail-on-severity:
        description: 'Fail CI on severity'
        required: false
        default: 'high'
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout central ZAP policy
        uses: actions/checkout@v4
        with:
          repository: sibydevops/security-workflows
          ref: main
          path: .security-workflows

      - name: Validate DAST target
        if: inputs.target-url == ''
        run: echo "No SECURITY_DAST_TARGET_URL configured; active OWASP ZAP scan is not applicable to this repository."

      - name: OWASP ZAP Baseline Scan
        if: inputs.target-url != '' && inputs.scan-type == 'baseline'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target-url }}
          rules_file_name: .security-workflows/configs/zap/rules.tsv
          cmd_options: '-a'
          artifact_name: 'zap-baseline-report'

      - name: OWASP ZAP Full Scan
        if: inputs.target-url != '' && inputs.scan-type == 'full'
        uses: zaproxy/action-full-scan@v0.1.0
        with:
          target: ${{ inputs.target-url }}
          rules_file_name: .security-workflows/configs/zap/rules.tsv
          cmd_options: '-a'
          artifact_name: 'zap-full-report'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('report_html.html') != ''
        with:
          name: zap-scan-report
          path: report_html.html

      - name: Upload ZAP Results to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('report_html.sarif') != ''
        with:
          sarif_file: report_html.sarif