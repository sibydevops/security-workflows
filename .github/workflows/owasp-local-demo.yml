name: OWASP Local Penetration Test Demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: OWASP ZAP against local test app
    runs-on: ubuntu-latest
    steps:
      - name: Start OWASP Juice Shop test application
        run: |
          docker run --detach --name juice-shop --publish 3000:3000 bkimminich/juice-shop:latest
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs juice-shop
          exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:3000
          cmd_options: '-a'
          artifact_name: owasp-zap-local-demo
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-local-demo-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
            report_md.md
