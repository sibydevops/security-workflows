name: Reusable Security Summary

on:
  workflow_call:
    inputs:
      app-type:
        description: 'Detected application profile'
        required: false
        default: unknown
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  security-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Generate Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Application profile:** ${{ inputs.app-type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          codeql_count=$(find reports -name "*.sarif" -exec cat {} \; | grep -c "ruleId" || echo "0")
          zap_count=$(find reports -name "report_html.html" -exec cat {} \; | grep -c "alert" || echo "0")
          astf_count=$(find reports -name "api-results.sarif" -exec cat {} \; | grep -c "ruleId" || echo "0")
          dependency_count=$(find reports -name "dependency-check-report.sarif" -exec cat {} \; | grep -c "ruleId" || echo "0")
          
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- **SAST (CodeQL):** $codeql_count findings" >> $GITHUB_STEP_SUMMARY
          echo "- **DAST (OWASP ZAP):** $zap_count findings" >> $GITHUB_STEP_SUMMARY
          echo "- **API Security (OWASP ASTF):** $astf_count findings" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Scanning (OWASP Dependency-Check):** $dependency_count findings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Detailed Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [CodeQL Report](../../security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "- [ZAP Report](../../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [ASTF Report](../../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Dependency-Check Report](../../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });