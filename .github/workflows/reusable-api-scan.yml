name: Reusable API Security Scan

on:
  workflow_call:
    inputs:
      api-url:
        description: 'API base URL for security testing'
        required: true
        type: string
      api-token:
        description: 'API authentication token'
        required: false
        type: string
      openapi-spec:
        description: 'Path to OpenAPI specification file'
        required: false
        type: string
      fail-on-severity:
        description: 'Fail CI on severity'
        required: false
        default: 'high'
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  api-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OWASP ASTF
        run: curl -LO https://github.com/OWASP/www-project-api-security-testing-framework/releases/latest/download/astf-v2.0.1.jar

      - name: Run ASTF Security Scan
        run: |
          java -jar astf-v2.0.1.jar \
            -u ${{ inputs.api-url }} \
            ${{ inputs.api-token && format('--token {0}', inputs.api-token) || '' }} \
            ${{ inputs.openapi-spec && format('--spec {0}', inputs.openapi-spec) || '' }} \
            -f SARIF \
            -o api-results.sarif

      - name: Upload ASTF Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astf-scan-report
          path: api-results.sarif

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: api-results.sarif