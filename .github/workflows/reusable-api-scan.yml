name: Reusable API Security Scan

on:
  workflow_call:
    inputs:
      api-url:
        description: 'API base URL for security testing'
        required: true
        type: string
      start-command:
        description: 'Optional command to start the API on the runner'
        required: false
        default: ''
        type: string
      test-port:
        description: 'Port used by the local API'
        required: false
        default: '5000'
        type: string
      openapi-spec:
        description: 'Path to OpenAPI specification file'
        required: false
        type: string
      fail-on-severity:
        description: 'Fail CI on severity'
        required: false
        default: 'high'
        type: string

    secrets:
      api-token:
        description: 'Optional API authentication token'
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  api-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start local API
        if: inputs.start-command != ''
        shell: bash
        run: |
          ${{ inputs.start-command }} > api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${{ inputs.test-port }}" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Validate API target
        if: inputs.api-url == ''
        run: echo "No SECURITY_API_URL configured; active OWASP ASTF scan is not applicable to this repository."

      - name: Download OWASP ASTF
        if: inputs.api-url != ''
        run: curl -LO https://github.com/OWASP/www-project-api-security-testing-framework/releases/latest/download/astf-v2.0.1.jar

      - name: Run ASTF Security Scan
        if: inputs.api-url != ''
        run: |
          java -jar astf-v2.0.1.jar \
            -u ${{ inputs.api-url }} \
            ${{ secrets.api-token && format('--token {0}', secrets.api-token) || '' }} \
            ${{ inputs.openapi-spec && format('--spec {0}', inputs.openapi-spec) || '' }} \
            -f SARIF \
            -o api-results.sarif

      - name: Upload ASTF Results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('api-results.sarif') != ''
        with:
          name: astf-scan-report
          path: api-results.sarif

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('api-results.sarif') != ''
        with:
          sarif_file: api-results.sarif