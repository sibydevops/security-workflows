name: Reusable SAST Scan

on:
  workflow_call:
    inputs:
      languages:
        description: CodeQL language
        required: true
        type: string
      queries:
        description: CodeQL query suite
        required: false
        default: security-extended
        type: string
      run-analysis:
        description: Whether supported source code was detected
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ inputs.languages }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: inputs.run-analysis
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.languages }}
          queries: ${{ inputs.queries }}

      - name: Autobuild
        if: inputs.run-analysis
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        if: inputs.run-analysis
        uses: github/codeql-action/analyze@v3

      - name: Report no supported source
        if: ${{ !inputs.run-analysis }}
        run: echo "No supported source language was detected; CodeQL analysis is not applicable."