name: OWASP Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  classify:
    name: Classify repository
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      app-type: ${{ steps.detect.outputs.app-type }}
      has-source: ${{ steps.detect.outputs.has-source }}
      has-dast-target: ${{ steps.detect.outputs.has-dast-target }}
      has-api-target: ${{ steps.detect.outputs.has-api-target }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Detect application profile
        id: detect
        shell: bash
        run: |
          languages=()
          find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*' | grep -q . || [[ -f package.json ]] && languages+=(javascript-typescript)
          find . -type f -name '*.py' -not -path './.git/*' | grep -q . && languages+=(python)
          find . -type f -name '*.java' -not -path './.git/*' | grep -q . || [[ -f pom.xml || -f build.gradle || -f build.gradle.kts ]] && languages+=(java-kotlin)
          find . -type f \( -name '*.cs' -o -name '*.csproj' -o -name '*.sln' \) -not -path './.git/*' | grep -q . && languages+=(csharp)
          find . -type f -name '*.go' -not -path './.git/*' | grep -q . || [[ -f go.mod ]] && languages+=(go)
          find . -type f -name '*.rs' -not -path './.git/*' | grep -q . || [[ -f Cargo.toml ]] && languages+=(rust)

          dotnet_web=false
          grep -RIl 'Microsoft\.NET\.Sdk\.Web' . --include='*.csproj' | grep -q . && dotnet_web=true

          if [[ -f Dockerfile || -f compose.yml || -f compose.yaml || -d .devcontainer || -d charts ]]; then
            app_type=cloud-native
          elif [[ -f package.json || -d public || -d src || "$dotnet_web" == true ]]; then
            app_type=web
          elif compgen -G '*.sln' > /dev/null || compgen -G '*.csproj' > /dev/null || compgen -G '*.xcodeproj' > /dev/null || compgen -G '*.xcworkspace' > /dev/null; then
            app_type=desktop
          else
            app_type=library-or-infrastructure
          fi

          language_list=$(IFS=,; echo "${languages[*]}")
          echo "languages=${language_list:-none}" >> "$GITHUB_OUTPUT"
          [[ -n "$language_list" ]] && echo 'has-source=true' >> "$GITHUB_OUTPUT" || echo 'has-source=false' >> "$GITHUB_OUTPUT"
          echo "app-type=$app_type" >> "$GITHUB_OUTPUT"
          [[ -n "${{ vars.SECURITY_DAST_TARGET_URL }}" ]] && echo 'has-dast-target=true' >> "$GITHUB_OUTPUT" || echo 'has-dast-target=false' >> "$GITHUB_OUTPUT"
          [[ -n "${{ vars.SECURITY_API_URL }}" ]] && echo 'has-api-target=true' >> "$GITHUB_OUTPUT" || echo 'has-api-target=false' >> "$GITHUB_OUTPUT"

  sast-scan:
    name: SAST Scan
    needs: classify
    uses: sibydevops/security-workflows/.github/workflows/reusable-sast-scan.yml@main
    with:
      languages: ${{ needs.classify.outputs.languages }}
      run-analysis: ${{ needs.classify.outputs.has-source == 'true' }}
      queries: security-extended

  dependency-scan:
    name: Dependency Scanning
    uses: sibydevops/security-workflows/.github/workflows/reusable-dependency-scan.yml@main
    with:
      project-name: ${{ github.event.repository.name }}
      scan-path: .
      format: SARIF

  dast-scan:
    name: DAST Scan (${{ needs.classify.outputs.app-type }})
    needs: classify
    uses: sibydevops/security-workflows/.github/workflows/reusable-dast-scan.yml@main
    with:
      target-url: ${{ vars.SECURITY_DAST_TARGET_URL }}
      zap-rules-file: configs/zap/rules.tsv
      scan-type: baseline

  api-scan:
    name: API Security Scan
    needs: classify
    uses: sibydevops/security-workflows/.github/workflows/reusable-api-scan.yml@main
    with:
      api-url: ${{ vars.SECURITY_API_URL }}
      openapi-spec: docs/openapi.yaml
    secrets:
      api-token: ${{ secrets.SECURITY_API_TOKEN }}

  security-summary:
    name: Security Summary
    needs: [classify, sast-scan, dependency-scan, dast-scan, api-scan]
    if: always()
    uses: sibydevops/security-workflows/.github/workflows/reusable-security-summary.yml@main
    with:
      app-type: ${{ needs.classify.outputs.app-type }}