name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      scan-level:
        description: 'Scan level'
        required: false
        default: 'verified,unverified'
        type: string
      fail-on-severity:
        description: 'Fail CI on severity'
        required: false
        default: 'high'
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: |
            [allowlist]
            description = "Global Allowlist"
            paths = [
              '''\.gitleaks\.toml''',
              '''go\.sum''',
              '''package-lock\.json''',
            ]

      - name: Upload GitLeaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif